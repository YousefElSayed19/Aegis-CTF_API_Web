services:
  aegis:
    build: .
    container_name: aegis-ctf
    ports:
      - "3000:3000"   # Web UI + REST + GraphQL
      - "50051:50051" # gRPC AdminService
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5
